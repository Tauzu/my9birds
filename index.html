<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>私を構成する9羽の鳥</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page-header">
  <h1>私を構成する9羽の鳥</h1>
  <p class="subtitle">あなたを表す9羽の野鳥を選んでください</p>
</div>

<div id="grid"></div>

<div class="controls">
  <input id="username" placeholder="あなたの名前">
  <button id="completeBtn">完成する</button>
</div>

<div id="overlay" class="hidden" onclick="closeModal()"></div>

<div id="modal" class="hidden">
  <div class="modal-header">
    <h2>鳥を選ぶ</h2>
    <button class="modal-close" onclick="closeModal()">✕</button>
  </div>
  <div class="modal-search">
    <input id="searchBox" placeholder="鳥を検索 (スズメ、ペンギン、eagle など)">
  </div>
  <div id="results"></div>
</div>

<script src="script.js"></script>

</body>
</html>
